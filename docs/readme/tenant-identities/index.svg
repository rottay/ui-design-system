<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="660" viewBox="0 0 1040 660" role="img" aria-labelledby="title description">
  <title id="title">One application. Two distinct tenant identities.</title>
  <desc id="description">Concept illustration, not a product screenshot. A shared application supports two presentations of the same project overview. The editorial tenant uses serif typography, rounded controls and generous spacing. The technical tenant uses sans-serif typography, squared controls and compact rows. Both deliberately use the same neutral palette and offer the same actions.</desc>
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18212b"/>
      <stop offset="1" stop-color="#0c1118"/>
    </linearGradient>
    <filter id="soft-shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
      .serif { font-family: Georgia, 'Times New Roman', serif; }
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
      .ink { fill: #24272b; }
      .muted { fill: #62666d; }
      .light { fill: #f7f4ed; }
    </style>
  </defs>

  <rect width="1040" height="660" rx="24" fill="url(#backdrop)"/>
  <rect x="0.5" y="0.5" width="1039" height="659" rx="23.5" fill="none" stroke="#33404d"/>
  <text x="44" y="44" fill="#c4b99e" font-size="14" font-weight="600" letter-spacing="2.8">THE TENANT-FIRST VISION</text>
  <text x="44" y="94" class="light" font-size="37" font-weight="600" letter-spacing="-1">Shared software. Individual character.</text>
  <text x="44" y="128" fill="#b4bec8" font-size="18">The same capabilities, expressed through each customer's own identity.</text>

  <rect x="300" y="159" width="440" height="46" rx="10" fill="#222d38" stroke="#596574"/>
  <text x="520" y="188" text-anchor="middle" class="light" font-size="18" font-weight="500">One application · Shared component families</text>
  <path d="M520 205 V223 M276 243 V223 H764 V243" fill="none" stroke="#b7ad94" stroke-width="1.5"/>
  <circle cx="276" cy="243" r="3.5" fill="#d2c7ac"/>
  <circle cx="764" cy="243" r="3.5" fill="#d2c7ac"/>

  <text x="44" y="266" fill="#c4b99e" font-size="14" letter-spacing="1.6">TENANT A / EDITORIAL</text>
  <text x="548" y="266" fill="#c4b99e" font-size="14" letter-spacing="1.6">TENANT B / TECHNICAL</text>

  <g filter="url(#soft-shadow)">
    <rect x="44" y="284" width="448" height="282" rx="20" fill="#f7f4ed"/>
  </g>
  <text x="74" y="320" class="serif ink" font-size="20">Workspace</text>
  <line x1="74" y1="335" x2="462" y2="335" stroke="#d7d4ce"/>
  <text x="74" y="375" class="serif ink" font-size="29">Project overview</text>
  <rect x="338" y="350" width="126" height="36" rx="18" fill="#24272b"/>
  <text x="401" y="374" text-anchor="middle" class="light" font-size="15">New project</text>
  <rect x="74" y="398" width="85" height="30" rx="15" fill="#e3dfd7"/>
  <text x="116.5" y="418" text-anchor="middle" class="ink" font-size="15">Active</text>
  <text x="179" y="418" class="muted" font-size="15">Archived</text>
  <rect x="74" y="451" width="19" height="19" rx="6" fill="none" stroke="#62666d" stroke-width="1.5"/>
  <text x="108" y="467" class="ink" font-size="18">Brand direction</text>
  <rect x="361" y="447" width="101" height="28" rx="14" fill="#e3dfd7"/>
  <text x="411.5" y="466" text-anchor="middle" class="ink" font-size="14">In review</text>
  <line x1="74" y1="488" x2="462" y2="488" stroke="#d7d4ce"/>
  <rect x="74" y="508" width="19" height="19" rx="6" fill="none" stroke="#62666d" stroke-width="1.5"/>
  <text x="108" y="524" class="ink" font-size="18">Product launch</text>
  <text x="395" y="524" class="muted" font-size="14">Planned</text>

  <rect x="548" y="284" width="448" height="282" rx="4" fill="#f7f4ed" stroke="#d7d4ce"/>
  <text x="572" y="316" class="mono ink" font-size="18" font-weight="600">WORKSPACE</text>
  <line x1="548" y1="332" x2="996" y2="332" stroke="#d7d4ce"/>
  <text x="572" y="366" class="ink" font-size="26" font-weight="650" letter-spacing="-0.8">Project overview</text>
  <rect x="849" y="344" width="123" height="31" rx="3" fill="#24272b"/>
  <text x="910.5" y="365" text-anchor="middle" class="light" font-size="14" font-weight="500">New project</text>
  <text x="582" y="406" class="ink" font-size="15" font-weight="600">Active</text>
  <text x="662" y="406" class="muted" font-size="15">Archived</text>
  <line x1="572" y1="417" x2="972" y2="417" stroke="#d7d4ce"/>
  <line x1="572" y1="417" x2="638" y2="417" stroke="#24272b" stroke-width="2.5"/>
  <rect x="576" y="432" width="16" height="16" rx="1" fill="none" stroke="#62666d" stroke-width="1.5"/>
  <text x="605" y="446" class="ink" font-size="16">Brand direction</text>
  <rect x="876" y="429" width="92" height="23" rx="2" fill="#e3dfd7"/>
  <text x="922" y="445" text-anchor="middle" class="mono ink" font-size="12">IN REVIEW</text>
  <line x1="572" y1="461" x2="972" y2="461" stroke="#d7d4ce"/>
  <rect x="576" y="474" width="16" height="16" rx="1" fill="none" stroke="#62666d" stroke-width="1.5"/>
  <text x="605" y="488" class="ink" font-size="16">Product launch</text>
  <text x="905" y="488" class="mono muted" font-size="12">PLANNED</text>
  <line x1="572" y1="503" x2="972" y2="503" stroke="#d7d4ce"/>
  <text x="572" y="542" class="mono muted" font-size="12">2 PROJECTS</text>

  <text x="44" y="597" fill="#d2d8de" font-size="16">Editorial type · Soft shapes · Open spacing</text>
  <text x="548" y="597" fill="#d2d8de" font-size="16">Precise type · Crisp edges · Compact rhythm</text>
  <line x1="44" y1="617" x2="996" y2="617" stroke="#33404d"/>
  <text x="44" y="642" fill="#aeb9c4" font-size="14">Same palette. Same capabilities. Different identities.</text>
  <text x="996" y="642" text-anchor="end" fill="#aeb9c4" font-size="14">Concept illustration · Target experience</text>
</svg>
