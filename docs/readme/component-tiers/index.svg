<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="224" viewBox="0 0 1040 224" role="img" aria-labelledby="title description">
  <title id="title">Four UI tiers, one direction of composition</title>
  <desc id="description">Primitives provide focused elements. Patterns compose them into reusable tasks. Structures frame those tasks. Surfaces describe complete screens.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#b7ad94"/></marker>
    <style>text { font-family: Arial, Helvetica, sans-serif; text-anchor: middle; }</style>
  </defs>
  <rect x="0.5" y="0.5" width="1039" height="223" rx="20" fill="#121a23" stroke="#33404d"/>
  <text x="520" y="42" fill="#c4b99e" font-size="15" letter-spacing="2">FROM A SINGLE CONTROL TO A COMPLETE SCREEN</text>
  <g fill="#222d38" stroke="#64748b">
    <rect x="30" y="70" width="220" height="96" rx="10"/>
    <rect x="283" y="70" width="220" height="96" rx="10"/>
    <rect x="536" y="70" width="220" height="96" rx="10"/>
    <rect x="789" y="70" width="220" height="96" rx="10"/>
  </g>
  <g fill="none" stroke="#b7ad94" stroke-width="2" marker-end="url(#arrow)">
    <path d="M250 118 H277"/><path d="M503 118 H530"/><path d="M756 118 H783"/>
  </g>
  <g fill="#f7f4ed" font-size="25" font-weight="600">
    <text x="140" y="111">Primitives</text><text x="393" y="111">Patterns</text>
    <text x="646" y="111">Structures</text><text x="899" y="111">Surfaces</text>
  </g>
  <g fill="#c4cdd6" font-size="18">
    <text x="140" y="141">Focused elements</text><text x="393" y="141">Reusable tasks</text>
    <text x="646" y="141">Page framing</text><text x="899" y="141">Complete screens</text>
  </g>
  <text x="520" y="200" font-size="17" fill="#b4bec8">Shared capabilities compose upward. Business meaning stays in the application.</text>
</svg>
