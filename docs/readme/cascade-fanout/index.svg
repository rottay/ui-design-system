<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="392" viewBox="0 0 1040 392" role="img" aria-labelledby="title description">
  <title id="title">One decision, multiple appropriate consequences</title>
  <desc id="description">A tenant chooses a softer shape. Shared shape rules are interpreted by buttons, fields, cards and overlays, each according to its own anatomy.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#b7ad94"/></marker>
    <style>text { font-family: Arial, Helvetica, sans-serif; text-anchor: middle; }</style>
  </defs>
  <rect x="0.5" y="0.5" width="1039" height="391" rx="20" fill="#121a23" stroke="#33404d"/>
  <rect x="330" y="28" width="380" height="66" rx="12" fill="#f7f4ed"/>
  <text x="520" y="53" font-size="14" fill="#62666d" letter-spacing="1.5">TENANT DECISION</text>
  <text x="520" y="80" font-size="25" font-weight="600" fill="#24272b">Softer shape</text>
  <path d="M520 94 V127" fill="none" stroke="#b7ad94" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="330" y="135" width="380" height="58" rx="10" fill="#222d38" stroke="#64748b"/>
  <text x="520" y="171" font-size="23" fill="#f7f4ed">Shared shape rules</text>
  <path d="M520 193 V223 M145 250 V223 H895 V250 M395 223 V250 M645 223 V250" fill="none" stroke="#b7ad94" stroke-width="2"/>
  <g fill="#f7f4ed">
    <rect x="35" y="252" width="220" height="80" rx="16"/>
    <rect x="285" y="252" width="220" height="80" rx="12"/>
    <rect x="535" y="252" width="220" height="80" rx="20"/>
    <rect x="785" y="252" width="220" height="80" rx="14"/>
  </g>
  <g fill="#24272b" font-size="23" font-weight="600">
    <text x="145" y="284">Buttons</text><text x="395" y="284">Fields</text>
    <text x="645" y="284">Cards</text><text x="895" y="284">Overlays</text>
  </g>
  <g fill="#62666d" font-size="17">
    <text x="145" y="312">Control geometry</text><text x="395" y="312">Input geometry</text>
    <text x="645" y="312">Surface geometry</text><text x="895" y="312">Container geometry</text>
  </g>
  <text x="520" y="367" font-size="17" fill="#b4bec8">A shared direction, interpreted for each family. Not one radius pasted everywhere.</text>
</svg>
