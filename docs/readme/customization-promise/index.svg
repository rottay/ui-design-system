<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="184" viewBox="0 0 1040 184" role="img" aria-labelledby="title description">
  <title id="title">Plans change editing freedom. Not the quality of the experience.</title>
  <desc id="description">Every tenant inherits a complete identity. The plan governs which decisions they may edit. Standard and Pro are customization access levels, not visual quality levels.</desc>
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; }
  </style>
  <rect width="1040" height="184" rx="14" fill="#1a2935"/>
  <rect x="29" y="31" width="3" height="123" rx="1.5" fill="#d5dfbd"/>
  <text x="52" y="49" class="mono" fill="#becbd2" font-size="11" letter-spacing="1.8">THE NON-NEGOTIABLE</text>
  <text x="51" y="94" fill="#f5f1e8" font-size="32" font-weight="500" letter-spacing="-0.9">Plans change editing freedom.</text>
  <text x="51" y="134" fill="#d5dfbd" font-size="32" font-weight="500" letter-spacing="-0.9">Not the quality of the experience.</text>
  <line x1="641" y1="37" x2="641" y2="147" stroke="#425460"/>
  <text x="672" y="75" fill="#f5f1e8" font-size="18" font-weight="500">Inherit a complete identity.</text>
  <text x="672" y="107" fill="#c1cdd5" font-size="16">Your plan determines what you can edit,</text>
  <text x="672" y="132" fill="#c1cdd5" font-size="16">not how well your product is rendered.</text>
</svg>
