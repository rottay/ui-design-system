name: Design System CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Design System CI/CD
    uses: rottay/.github-workflows/.github/workflows/package-ci-changesets.yml@v1.7.0
    with:
      run-lint: false
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  storybook:
    needs: checks
    name: Build Storybook
    runs-on: self-hosted
    timeout-minutes: 20
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@rottay'
      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Build Storybook
        id: storybook
        run: |
          start_ts=$(date +%s)
          set +e
          pnpm build-storybook 2>&1 | tee /tmp/storybook.txt
          result=$?
          set -e
          dur=$(( $(date +%s) - start_ts ))
          {
            echo "## Storybook Build"
            echo ""
            echo "> Design System component library build."
            echo ""
            echo "| Status | Duration | Runner |"
            echo "|:------:|:--------:|:------:|"
            if [ $result -eq 0 ]; then
              echo "| **Passed** | ${dur}s | $(hostname) |"
            else
              echo "| **Failed** | ${dur}s | $(hostname) |"
            fi
            echo ""
            echo "---"
            echo "*Commit: [\`${GITHUB_SHA:0:7}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) on \`${GITHUB_REF_NAME}\` by \`${GITHUB_ACTOR}\`*"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $result
        env:
          NODE_OPTIONS: --max-old-space-size=5120
