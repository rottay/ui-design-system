name: '[ui] Design System'

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ds-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ─────────────────────────────────────────────────────
  #  Detect which packages changed
  # ─────────────────────────────────────────────────────
  detect:
    name: Detect Changes
    runs-on: self-hosted
    timeout-minutes: 2
    outputs:
      core: ${{ steps.changes.outputs.core }}
      showroom: ${{ steps.changes.outputs.showroom }}
      gates: ${{ steps.changes.outputs.gates }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed packages
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          else
            BEFORE="${{ github.event.before }}"
            SHA="${{ github.sha }}"
            ZERO_SHA="0000000000000000000000000000000000000000"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "$ZERO_SHA" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              CHANGED=$(git diff --name-only "$BEFORE...$SHA")
            else
              # A new branch has no previous SHA. Treat its complete tree as
              # changed so no package gate can false-negative on the first push.
              CHANGED=$(git ls-tree -r --name-only "$SHA")
            fi
          fi

          CORE="false"
          SHOWROOM="false"

          if echo "$CHANGED" | grep -qE '^(packages/core/|scripts/dependency-honesty\.(mjs|test\.mjs)$|scripts/effect-registry-audit(\.test)?\.mjs$|packages/showroom/e2e/responsive/overflow-baseline\.json$|roadmap/(skin-exemptions|skin-census)\.json$|\.github/workflows/ci\.yml$)'; then
            CORE="true"
          fi

          if echo "$CHANGED" | grep -q '^packages/showroom/'; then
            SHOWROOM="true"
          fi

          # Root config changes affect both
          if echo "$CHANGED" | grep -qE '^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig\.json)'; then
            CORE="true"
            SHOWROOM="true"
          fi

          # Local-gate set: structure/audit/census gates plus roadmap:check.
          # roadmap/ and root scripts/ changes trigger nothing else, so the
          # ledger-consistency and motion/structure gates would never run
          # without their own trigger (audit GAT-04).
          GATES="false"
          if echo "$CHANGED" | grep -qE '^(packages/core/|scripts/|roadmap/|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|\.github/workflows/ci\.yml$)'; then
            GATES="true"
          fi

          echo "core=$CORE" >> $GITHUB_OUTPUT
          echo "showroom=$SHOWROOM" >> $GITHUB_OUTPUT
          echo "gates=$GATES" >> $GITHUB_OUTPUT
          echo "Core changed: $CORE"
          echo "Showroom changed: $SHOWROOM"
          echo "Gates triggered: $GATES"

  # ─────────────────────────────────────────────────────
  #  Core Library (typecheck, build, test, storybook)
  # ─────────────────────────────────────────────────────
  core:
    name: Core Library
    needs: detect
    if: needs.detect.outputs.core == 'true'
    runs-on: self-hosted
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@rottay'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Typecheck
        run: pnpm --filter @rottay/design-system run typecheck

      # GAT-03: test files are excluded from the production tsconfig, so a spec
      # could import a nonexistent symbol and stay green. This type-checks them
      # under a decrease-only error-count ratchet (large standing debt, bites on
      # any NEW test type error). Runs off source, no build required.
      - name: Typecheck test files (GAT-03 ratchet)
        run: pnpm --filter @rottay/design-system run typecheck:tests

      # WO-GAT-04: the engine-token ratchet includes the APCA contrast counter
      # (a11y.apcaPairings). It runs off source, so no build is required first.
      # (test:ci does not trigger the `pretest` hook, so it is gated explicitly.)
      - name: Engine token + APCA audit
        run: pnpm --filter @rottay/design-system run engine-audit:check

      - name: Audit machinery regression tests
        run: pnpm --filter @rottay/design-system run test:scripts

      - name: Effect provenance and registry evidence
        run: |
          pnpm effects:provenance
          pnpm effects:provenance:test

      - name: Checkout WO-GAT-07 documentation evidence
        uses: actions/checkout@v4
        with:
          repository: rottay/docs-engineering
          ref: ad5edfe12f4ce97285e829281ed23da16754ac50
          path: .gat07/docs-engineering
          token: ${{ secrets.DOCS_TOOLING_TOKEN || secrets.NPM_TOKEN || github.token }}

      - name: WO-GAT-07 exact proof and artifact freshness
        run: pnpm --filter @rottay/design-system run gat07:check
        env:
          DOCS_ENGINEERING_ROOT: ${{ github.workspace }}/.gat07/docs-engineering

      - name: Dependency graph and identity honesty
        run: |
          pnpm dependency:honesty:test
          node scripts/dependency-honesty.mjs static

      # Must run BEFORE Build. `build` runs `build:vertical-css`, which regenerates
      # every first-party artifact in place -- so by the time any test runs, a
      # hand-edited artifact has already been silently overwritten with a correct
      # one and nothing downstream can observe the bad committed state. The
      # `pretest` hook that chains `lint:artifacts` never fires either, because
      # `test:ci` is not named `test`. This step reads the artifacts from source
      # (it does not need `dist/`, which only Build produces) and is the only slot
      # in this workflow where the staleness check can actually see anything.
      - name: Artifact staleness (before Build regenerates them)
        run: pnpm --filter @rottay/design-system exec vitest run src/foundation/tokens/__tests__/first-party-artifacts-generated.test.ts

      # GAT-02: the six committed styles/*.css bundles ship in the npm files list
      # but had no CI check, and Build (below) regenerates them in place, masking
      # any committed drift. This recomposes every bundle IN MEMORY (compiling the
      # modern engine from source via postcss, no dist dependency) and byte-diffs
      # against the committed files. It MUST run before Build for the same reason
      # the artifact-staleness step above does.
      - name: Styles bundle staleness (GAT-02, before Build regenerates them)
        run: pnpm --filter @rottay/design-system run gate:styles-css

      # The package postbuild hook runs the WO-CRA-14 public-barrel/chunk gate
      # against the exact dist artifacts produced immediately above it.
      - name: Build + ParticleField quarantine gate
        run: pnpm --filter @rottay/design-system run build

      - name: Packed artifact and non-consuming bundle honesty
        run: node scripts/dependency-honesty.mjs pack

      - name: Bundle budgets
        run: |
          pnpm --filter @rottay/design-system run analyze -- --skip-build
          pnpm --filter @rottay/design-system run analyze:components

      - name: Unit tests with coverage
        run: pnpm --filter @rottay/design-system run test:ci
        env:
          NODE_ENV: test

      - name: Coverage summary
        if: always()
        run: |
          COVERAGE_FILE="packages/core/coverage/coverage-summary.json"
          if [ -f "$COVERAGE_FILE" ]; then
            LINES=$(node -e "const c=require('./$COVERAGE_FILE');console.log(c.total.lines.pct)")
            BRANCHES=$(node -e "const c=require('./$COVERAGE_FILE');console.log(c.total.branches.pct)")
            FUNCTIONS=$(node -e "const c=require('./$COVERAGE_FILE');console.log(c.total.functions.pct)")
            STATEMENTS=$(node -e "const c=require('./$COVERAGE_FILE');console.log(c.total.statements.pct)")

            {
              echo "## Core Library - Coverage"
              echo ""
              echo "| Metric | Coverage |"
              echo "|--------|----------|"
              echo "| Lines | ${LINES}% |"
              echo "| Branches | ${BRANCHES}% |"
              echo "| Functions | ${FUNCTIONS}% |"
              echo "| Statements | ${STATEMENTS}% |"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Coverage file not found, skipping summary" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build Storybook
        if: github.ref == 'refs/heads/main'
        run: pnpm --filter @rottay/design-system run build-storybook
        env:
          NODE_OPTIONS: --max-old-space-size=5120

      - name: Security audit
        run: pnpm audit --audit-level=high || true

  # ─────────────────────────────────────────────────────
  #  Showroom App (typecheck, lint, build)
  # ─────────────────────────────────────────────────────
  showroom:
    name: Showroom App
    needs: [detect, core]
    if: |
      always() &&
      (needs.detect.outputs.showroom == 'true' || needs.detect.outputs.core == 'true') &&
      (needs.core.result == 'success' || needs.core.result == 'skipped')
    runs-on: self-hosted
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@rottay'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build core (dependency)
        run: pnpm --filter @rottay/design-system run build

      - name: Typecheck
        run: pnpm --filter @rottay/showroom run typecheck

      # GAT-03: e2e specs and both Playwright configs are type-erased too.
      # Same decrease-only ratchet as core.
      - name: Typecheck test files (GAT-03 ratchet)
        run: pnpm --filter @rottay/showroom run typecheck:tests

      # GAT-01: proves the dead-selector audit's collectRules() reads the real
      # skin corpus (thousands of selectors) rather than scanning relocated paths
      # and asserting nothing. Node-only, no browser — the Playwright audit itself
      # runs in the visual job against the production build.
      - name: Skin-rule collection non-vacuity (GAT-01 unit)
        run: pnpm --filter @rottay/showroom run test:diagnostics

      - name: Lint
        run: pnpm --filter @rottay/showroom run lint

      - name: Build
        run: pnpm --filter @rottay/showroom run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  # ─────────────────────────────────────────────────────
  #  Accessibility CI — axe + focus sweep (WO-GAT-04)
  # ─────────────────────────────────────────────────────
  a11y:
    name: Accessibility (a11y)
    needs: [detect, core]
    if: |
      always() &&
      (needs.detect.outputs.showroom == 'true' || needs.detect.outputs.core == 'true') &&
      (needs.core.result == 'success' || needs.core.result == 'skipped')
    runs-on: self-hosted
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@rottay'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The showroom dev server (Playwright webServer) imports the built DS.
      - name: Build core (dependency)
        run: pnpm --filter @rottay/design-system run build

      - name: Install Playwright browser
        run: pnpm --filter @rottay/showroom exec playwright install chromium

      # axe.spec.ts + focus.spec.ts drive the flagship galleries under both tenant
      # palettes. Playwright starts the dev server via its webServer config (CI:
      # reuseExistingServer is false).
      - name: Run a11y specs (axe + focus sweep)
        run: pnpm --filter @rottay/showroom exec playwright test e2e/a11y

      - name: Upload a11y report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: |
            test-artifacts/gates/gat-04
            packages/showroom/test-results
          if-no-files-found: ignore
          retention-days: 14

  # ─────────────────────────────────────────────────────
  #  Visual regression CI — screenshot diff on the showroom (WO-GAT-01)
  # ─────────────────────────────────────────────────────
  visual:
    name: Visual Regression + Whitelabel
    needs: [detect, core, showroom]
    if: |
      always() &&
      (needs.detect.outputs.showroom == 'true' || needs.detect.outputs.core == 'true') &&
      (needs.core.result == 'success' || needs.core.result == 'skipped') &&
      (needs.showroom.result == 'success' || needs.showroom.result == 'skipped')
    runs-on: self-hosted
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@rottay'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build core (dependency)
        run: pnpm --filter @rottay/design-system run build

      # e2e/visual/ runs against the PRODUCTION build, never the dev server
      # (dev-mode Turbopack/HMR paints non-deterministically) — playwright.visual.config.ts's
      # webServer starts `next start` over this build.
      - name: Build showroom (production)
        run: pnpm --filter @rottay/showroom run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Install Playwright browser
        run: pnpm --filter @rottay/showroom exec playwright install chromium

      # One invocation, one `next start`: e2e/visual/ (pixel diffs, WO-GAT-01),
      # e2e/whitelabel/ (hostile-tenant computed-style probe, WO-GAT-03), and
      # e2e/responsive/ (360px overflow + coarse-pointer hit areas, WO-ENG-12)
      # are the three spec directories playwright.visual.config.ts matches.
      - name: Run visual regression, whitelabel, and responsive suites
        run: pnpm --filter @rottay/showroom run test:gates

      - name: Upload visual regression report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: |
            test-artifacts/gates/gat-01
            test-artifacts/gates/gat-03
            packages/showroom/test-results
            packages/showroom/playwright-report
          if-no-files-found: ignore
          retention-days: 14

  # ─────────────────────────────────────────────────────
  #  Local gates — structure/audits/census/roadmap (audit GAT-04)
  #  These node gates were maintained but never ran in CI, so structure
  #  law, brand-compiler emitter closure, census staleness and roadmap
  #  ledger integrity were enforced only by contributor discipline.
  # ─────────────────────────────────────────────────────
  local_gates:
    name: Local Gates
    needs: detect
    if: needs.detect.outputs.gates == 'true'
    runs-on: self-hosted
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@rottay'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Structure real-tree check
        run: pnpm --filter @rottay/design-system run structure:check

      # P-76: unlayered paint twins must stay unlayered and the layered bridge
      # files must never regrow preflight-killable paint (decrease-only ceilings).
      - name: CSS layer paint gate (P-76)
        run: pnpm --filter @rottay/design-system run csspaint:check

      - name: Integration audit (brand-compiler emitter closure)
        run: pnpm --filter @rottay/design-system run lint:integration

      - name: Vertical compliance
        run: pnpm --filter @rottay/design-system run lint:vertical

      - name: CRA-11 adaptive/factory census staleness
        run: pnpm run cra11:check

      # Allow-listed OFF (structural): cra-12 scanWorkspace() throws unless
      # ../app-bithire and ../app-platform are present at pinned SHAs — a
      # cross-repo dependency this single-repo checkout does not satisfy. TODO
      # wire with sibling checkouts, or split the DS-local slice out of the gate.
      - name: CRA-12 motion governance
        run: pnpm run cra12:check || echo "::warning title=cra12:check allow-listed::cross-repo gate needs ../app-bithire and ../app-platform checkouts at pinned SHAs"

      - name: Roadmap ledger consistency
        run: pnpm run roadmap:check

  # ─────────────────────────────────────────────────────
  #  Changeset Validation (PRs only)
  # ─────────────────────────────────────────────────────
  changeset:
    name: Changeset Validation
    runs-on: self-hosted
    timeout-minutes: 3
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate changeset
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '^packages/core/' || true)
          if [ -n "$CHANGED" ]; then
            CHANGESETS=$(ls .changeset/*.md 2>/dev/null | grep -v README || true)
            if [ -z "$CHANGESETS" ]; then
              echo "::error::Core library changes detected but no changeset found. Run: pnpm changeset"
              echo ""
              echo "Changed files:"
              echo "$CHANGED"
              exit 1
            fi
            echo "Changeset found: $CHANGESETS"
          else
            echo "No core library changes, changeset not required"
          fi

  # ─────────────────────────────────────────────────────
  #  Summary
  # ─────────────────────────────────────────────────────
  gate:
    name: Summary
    needs: [detect, core, showroom, a11y, visual, local_gates, changeset]
    if: always()
    runs-on: self-hosted
    timeout-minutes: 2
    steps:
      - name: Evaluate results
        run: |
          echo "## Design System - Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|--------|" >> "$GITHUB_STEP_SUMMARY"

          CORE_RESULT="${{ needs.core.result }}"
          SHOWROOM_RESULT="${{ needs.showroom.result }}"
          A11Y_RESULT="${{ needs.a11y.result }}"
          VISUAL_RESULT="${{ needs.visual.result }}"
          LOCAL_GATES_RESULT="${{ needs.local_gates.result }}"
          CHANGESET_RESULT="${{ needs.changeset.result }}"

          if [ "$CORE_RESULT" = "skipped" ]; then
            echo "| Core Library | Skipped (no changes) |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Core Library | $CORE_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$SHOWROOM_RESULT" = "skipped" ]; then
            echo "| Showroom App | Skipped (no changes) |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Showroom App | $SHOWROOM_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$A11Y_RESULT" = "skipped" ]; then
            echo "| Accessibility (a11y) | Skipped (no changes) |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Accessibility (a11y) | $A11Y_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$VISUAL_RESULT" = "skipped" ]; then
            echo "| Visual Regression + Whitelabel | Skipped (no changes) |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Visual Regression + Whitelabel | $VISUAL_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$LOCAL_GATES_RESULT" = "skipped" ]; then
            echo "| Local Gates | Skipped (no changes) |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Local Gates | $LOCAL_GATES_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$CHANGESET_RESULT" = "skipped" ]; then
            echo "| Changeset | Skipped (push event) |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Changeset | $CHANGESET_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Fail if any required job failed or was cancelled
          if [ "$CORE_RESULT" = "failure" ] || [ "$CORE_RESULT" = "cancelled" ] || [ "$SHOWROOM_RESULT" = "failure" ] || [ "$SHOWROOM_RESULT" = "cancelled" ] || [ "$A11Y_RESULT" = "failure" ] || [ "$A11Y_RESULT" = "cancelled" ] || [ "$VISUAL_RESULT" = "failure" ] || [ "$VISUAL_RESULT" = "cancelled" ] || [ "$LOCAL_GATES_RESULT" = "failure" ] || [ "$LOCAL_GATES_RESULT" = "cancelled" ] || [ "$CHANGESET_RESULT" = "failure" ]; then
            echo ""
            echo "CI FAILED"
            exit 1
          fi

          echo ""
          echo "CI passed"
