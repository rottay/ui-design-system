name: '[ui] Design System'

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ds-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ─────────────────────────────────────────────────────
  #  Detect which packages changed
  # ─────────────────────────────────────────────────────
  detect:
    name: Detect Changes
    runs-on: self-hosted
    timeout-minutes: 2
    outputs:
      core: ${{ steps.changes.outputs.core }}
      showroom: ${{ steps.changes.outputs.showroom }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed packages
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          else
            CHANGED=$(git diff --name-only HEAD~1 2>/dev/null || git diff --name-only HEAD)
          fi

          CORE="false"
          SHOWROOM="false"

          if echo "$CHANGED" | grep -q '^packages/core/'; then
            CORE="true"
          fi

          if echo "$CHANGED" | grep -q '^packages/showroom/'; then
            SHOWROOM="true"
          fi

          # Root config changes affect both
          if echo "$CHANGED" | grep -qE '^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig\.json)'; then
            CORE="true"
            SHOWROOM="true"
          fi

          echo "core=$CORE" >> $GITHUB_OUTPUT
          echo "showroom=$SHOWROOM" >> $GITHUB_OUTPUT
          echo "Core changed: $CORE"
          echo "Showroom changed: $SHOWROOM"

  # ─────────────────────────────────────────────────────
  #  Core Library (typecheck, build, test, storybook)
  # ─────────────────────────────────────────────────────
  core:
    name: Core Library
    needs: detect
    if: needs.detect.outputs.core == 'true'
    runs-on: self-hosted
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@rottay'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Typecheck
        run: pnpm --filter @rottay/design-system run typecheck

      # WO-GAT-04: the engine-token ratchet includes the APCA contrast counter
      # (a11y.apcaPairings). It runs off source, so no build is required first.
      # (test:ci does not trigger the `pretest` hook, so it is gated explicitly.)
      - name: Engine token + APCA audit
        run: pnpm --filter @rottay/design-system run engine-audit:check

      - name: Build
        run: pnpm --filter @rottay/design-system run build

      - name: Bundle budgets
        run: |
          pnpm --filter @rottay/design-system run analyze -- --skip-build
          pnpm --filter @rottay/design-system run analyze:components

      - name: Unit tests with coverage
        run: pnpm --filter @rottay/design-system run test:ci
        env:
          NODE_ENV: test

      - name: Coverage summary
        if: always()
        run: |
          COVERAGE_FILE="packages/core/coverage/coverage-summary.json"
          if [ -f "$COVERAGE_FILE" ]; then
            LINES=$(node -e "const c=require('./$COVERAGE_FILE');console.log(c.total.lines.pct)")
            BRANCHES=$(node -e "const c=require('./$COVERAGE_FILE');console.log(c.total.branches.pct)")
            FUNCTIONS=$(node -e "const c=require('./$COVERAGE_FILE');console.log(c.total.functions.pct)")
            STATEMENTS=$(node -e "const c=require('./$COVERAGE_FILE');console.log(c.total.statements.pct)")

            {
              echo "## Core Library - Coverage"
              echo ""
              echo "| Metric | Coverage |"
              echo "|--------|----------|"
              echo "| Lines | ${LINES}% |"
              echo "| Branches | ${BRANCHES}% |"
              echo "| Functions | ${FUNCTIONS}% |"
              echo "| Statements | ${STATEMENTS}% |"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Coverage file not found, skipping summary" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build Storybook
        if: github.ref == 'refs/heads/main'
        run: pnpm --filter @rottay/design-system run build-storybook
        env:
          NODE_OPTIONS: --max-old-space-size=5120

      - name: Security audit
        run: pnpm audit --audit-level=high || true

  # ─────────────────────────────────────────────────────
  #  Showroom App (typecheck, lint, build)
  # ─────────────────────────────────────────────────────
  showroom:
    name: Showroom App
    needs: [detect, core]
    if: |
      always() &&
      (needs.detect.outputs.showroom == 'true' || needs.detect.outputs.core == 'true') &&
      (needs.core.result == 'success' || needs.core.result == 'skipped')
    runs-on: self-hosted
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@rottay'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build core (dependency)
        run: pnpm --filter @rottay/design-system run build

      - name: Typecheck
        run: pnpm --filter @rottay/showroom run typecheck

      - name: Lint
        run: pnpm --filter @rottay/showroom run lint

      - name: Build
        run: pnpm --filter @rottay/showroom run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  # ─────────────────────────────────────────────────────
  #  Accessibility CI — axe + focus sweep (WO-GAT-04)
  # ─────────────────────────────────────────────────────
  a11y:
    name: Accessibility (a11y)
    needs: [detect, core]
    if: |
      always() &&
      (needs.detect.outputs.showroom == 'true' || needs.detect.outputs.core == 'true') &&
      (needs.core.result == 'success' || needs.core.result == 'skipped')
    runs-on: self-hosted
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@rottay'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The showroom dev server (Playwright webServer) imports the built DS.
      - name: Build core (dependency)
        run: pnpm --filter @rottay/design-system run build

      - name: Install Playwright browser
        run: pnpm --filter @rottay/showroom exec playwright install chromium

      # axe.spec.ts + focus.spec.ts drive the flagship galleries under both tenant
      # palettes. Playwright starts the dev server via its webServer config (CI:
      # reuseExistingServer is false).
      - name: Run a11y specs (axe + focus sweep)
        run: pnpm --filter @rottay/showroom exec playwright test e2e/a11y

      - name: Upload a11y report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: |
            test-artifacts/gates/gat-04
            packages/showroom/test-results
          if-no-files-found: ignore
          retention-days: 14

  # ─────────────────────────────────────────────────────
  #  Visual regression CI — screenshot diff on the showroom (WO-GAT-01)
  # ─────────────────────────────────────────────────────
  visual:
    name: Visual Regression
    needs: [detect, core, showroom]
    if: |
      always() &&
      (needs.detect.outputs.showroom == 'true' || needs.detect.outputs.core == 'true') &&
      (needs.core.result == 'success' || needs.core.result == 'skipped') &&
      (needs.showroom.result == 'success' || needs.showroom.result == 'skipped')
    runs-on: self-hosted
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@rottay'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build core (dependency)
        run: pnpm --filter @rottay/design-system run build

      # e2e/visual/ runs against the PRODUCTION build, never the dev server
      # (dev-mode Turbopack/HMR paints non-deterministically) — playwright.visual.config.ts's
      # webServer starts `next start` over this build.
      - name: Build showroom (production)
        run: pnpm --filter @rottay/showroom run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Install Playwright browser
        run: pnpm --filter @rottay/showroom exec playwright install chromium

      - name: Run visual regression suite
        run: pnpm --filter @rottay/showroom run test:visual

      - name: Upload visual regression report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: |
            test-artifacts/gates/gat-01
            packages/showroom/test-results
            packages/showroom/playwright-report
          if-no-files-found: ignore
          retention-days: 14

  # ─────────────────────────────────────────────────────
  #  Changeset Validation (PRs only)
  # ─────────────────────────────────────────────────────
  changeset:
    name: Changeset Validation
    runs-on: self-hosted
    timeout-minutes: 3
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate changeset
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '^packages/core/' || true)
          if [ -n "$CHANGED" ]; then
            CHANGESETS=$(ls .changeset/*.md 2>/dev/null | grep -v README || true)
            if [ -z "$CHANGESETS" ]; then
              echo "::error::Core library changes detected but no changeset found. Run: pnpm changeset"
              echo ""
              echo "Changed files:"
              echo "$CHANGED"
              exit 1
            fi
            echo "Changeset found: $CHANGESETS"
          else
            echo "No core library changes, changeset not required"
          fi

  # ─────────────────────────────────────────────────────
  #  Summary
  # ─────────────────────────────────────────────────────
  gate:
    name: Summary
    needs: [detect, core, showroom, a11y, visual, changeset]
    if: always()
    runs-on: self-hosted
    timeout-minutes: 2
    steps:
      - name: Evaluate results
        run: |
          echo "## Design System - Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|--------|" >> "$GITHUB_STEP_SUMMARY"

          CORE_RESULT="${{ needs.core.result }}"
          SHOWROOM_RESULT="${{ needs.showroom.result }}"
          A11Y_RESULT="${{ needs.a11y.result }}"
          VISUAL_RESULT="${{ needs.visual.result }}"
          CHANGESET_RESULT="${{ needs.changeset.result }}"

          if [ "$CORE_RESULT" = "skipped" ]; then
            echo "| Core Library | Skipped (no changes) |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Core Library | $CORE_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$SHOWROOM_RESULT" = "skipped" ]; then
            echo "| Showroom App | Skipped (no changes) |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Showroom App | $SHOWROOM_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$A11Y_RESULT" = "skipped" ]; then
            echo "| Accessibility (a11y) | Skipped (no changes) |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Accessibility (a11y) | $A11Y_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$VISUAL_RESULT" = "skipped" ]; then
            echo "| Visual Regression | Skipped (no changes) |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Visual Regression | $VISUAL_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$CHANGESET_RESULT" = "skipped" ]; then
            echo "| Changeset | Skipped (push event) |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Changeset | $CHANGESET_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Fail if any required job failed or was cancelled
          if [ "$CORE_RESULT" = "failure" ] || [ "$CORE_RESULT" = "cancelled" ] || [ "$SHOWROOM_RESULT" = "failure" ] || [ "$SHOWROOM_RESULT" = "cancelled" ] || [ "$A11Y_RESULT" = "failure" ] || [ "$A11Y_RESULT" = "cancelled" ] || [ "$VISUAL_RESULT" = "failure" ] || [ "$VISUAL_RESULT" = "cancelled" ] || [ "$CHANGESET_RESULT" = "failure" ]; then
            echo ""
            echo "CI FAILED"
            exit 1
          fi

          echo ""
          echo "CI passed"
