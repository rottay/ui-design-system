name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  ci:
    name: Typecheck / Test / Build
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clean pnpm setup dir
        run: rm -rf /home/github-runner/setup-pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # ── Step 1: Typecheck ──────────────────────────────────────────────
      - name: Typecheck
        run: pnpm run typecheck
        working-directory: packages/core

      # ── Step 2: Build ──────────────────────────────────────────────────
      - name: Build
        run: pnpm run build
        working-directory: packages/core

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: packages/core/dist/
          retention-days: 15
